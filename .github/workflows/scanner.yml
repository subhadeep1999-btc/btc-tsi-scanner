name: BTC TSI Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test Telegram message"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: tsi-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run scanner
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST_ALERT: ${{ github.event.inputs.test_alert }}
        run: python scanner.py

      - name: Save state
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "scanner-bot"
            git config user.email "scanner-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update scanner state"
            git push
          fi
